    <script>
      const SUPABASE_URL = "https://nbrachqddfabogbgysjw.supabase.co";
      const SUPABASE_KEY = "sb_publishable_nw-jJ3tpvIjAFx-7TyD0Tw_qN31Gke-";
      const TRIP_ID = "main";
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      window.storage = {
        async get(key, shared) {
          if (shared && key === "trip-data") {
            const { data, error } = await supabaseClient
              .from("trips")
              .select("title, items")
              .eq("id", TRIP_ID)
              .single();

            if (error) throw error;
            return {
              value: JSON.stringify({
                title: data.title || "我的旅行",
                items: data.items || { accommodation: [], car: [], attraction: [] },
              }),
            };
          }

          const value = localStorage.getItem(storageKey(key, shared));
          if (value == null) throw new Error("Missing key");
          return { value };
        },
        async set(key, value, shared) {
          if (shared && key === "trip-data") {
            const trip = JSON.parse(value);
            const { error } = await supabaseClient.from("trips").upsert({
              id: TRIP_ID,
              title: trip.title || "我的旅行",
              items: trip.items || { accommodation: [], car: [], attraction: [] },
              updated_at: new Date().toISOString(),
            });

            if (error) throw error;
            return true;
          }

          localStorage.setItem(storageKey(key, shared), value);
          return true;
        },
      };

      function storageKey(key, shared) {
        return `travel-tracker:${shared ? "shared" : "personal"}:${key}`;
      }
    </script>

        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(90deg, transparent 0 8%, rgba(255,248,232,0.26) 43%, rgba(255,248,232,0.42) 50%, rgba(255,248,232,0.26) 57%, transparent 92%),
          radial-gradient(ellipse at 50% 48%, rgba(255,238,178,0.34), transparent 28rem),
          linear-gradient(180deg, rgba(255,255,255,0.08), transparent 34%);
        opacity: 0.95;
      }
      .sunset-page::after {
        content: "";
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 32vh;
        pointer-events: none;
        background: linear-gradient(180deg, transparent, rgba(7,76,88,0.42));
      }

      .luggage-tag {
        position: relative;
        padding: 1.6rem 2.4rem;
        border-radius: 0.5rem 1.4rem 0.5rem 1.4rem;
        transform: rotate(-1.4deg);
        box-shadow: 0 18px 42px rgba(108,64,43,0.24), inset 0 1px 0 rgba(255,255,255,0.62);
      }
      .luggage-tag::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background: linear-gradient(120deg, rgba(255,255,255,0.36), transparent 42%, rgba(222,159,89,0.12));
      }
      .tag-hole {
        position: absolute;
        top: 10px;
        left: 18px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .tag-string {
        position: absolute;
        top: -14px;
        left: 23px;
        width: 3px;
        height: 18px;
        transform: rotate(20deg);
        border-radius: 2px;
      }
      .tag-input {
        position: relative;
        z-index: 1;
        background: transparent;
        border: none;
        outline: none;
        text-align: center;
        font-weight: 800;
        font-size: 1.5rem;
        min-width: 12rem;
        max-width: 100%;
      }
      @media (min-width: 640px) {
        .tag-input { font-size: 1.9rem; }
      }

      .ticket-card {
        border-radius: 0.9rem;
        overflow: visible;
        box-shadow: 0 14px 28px rgba(108,64,43,0.2), inset 0 1px 0 rgba(255,255,255,0.56);
      }
      .itinerary-day {
        border-radius: 0.45rem;
        box-shadow: 0 16px 34px rgba(18,59,68,0.18), inset 0 1px 0 rgba(255,255,255,0.5);
      }
      .itinerary-table-wrap {
        width: 100%;
        overflow-x: auto;
        background: #fff;
      }
      .itinerary-table {
        min-width: 760px;
        table-layout: fixed;
      }
      .itinerary-table th,
      .itinerary-table td {
        border: 1px solid rgba(36,48,42,0.18);
        vertical-align: top;
      }
      .itinerary-table th {
        background: rgba(35,111,120,0.14);
        color: #0F6875;
        padding: 1rem;
        text-align: center;
        font-weight: 900;
      }
      .itinerary-table th span,
      .itinerary-table th em {
        display: block;
      }
      .itinerary-table th em {
        margin-top: 0.35rem;
        color: rgba(35,57,70,0.62);
        font-size: 0.86rem;
        font-style: italic;
        font-weight: 500;
      }
      .itinerary-table td {
        padding: 0.95rem 1rem;
        background: rgba(255,255,255,0.9);
        line-height: 1.55;
      }
      .itinerary-table tbody tr:nth-child(even) td {
        background: rgba(246,249,246,0.9);
      }
      .itinerary-time-col {
        width: 9.5rem;
        text-align: center;
      }
      .itinerary-time-col em {
        display: block;
        margin-top: 0.25rem;
        color: ${TEXT_MUTED};
        font-size: 0.86rem;
        font-style: italic;
        font-weight: 500;
      }
      .itinerary-row-actions button:hover {
        background: rgba(35,111,120,0.08);
      }
      .day-edit-button:hover {
        background: rgba(255,248,232,0.24) !important;
      }
      .ticket-stub {
        border-top: 1.5px dashed rgba(36,48,42,0.3);
        min-width: 0;
      }
      @media (min-width: 768px) {
        .ticket-stub {
          border-top: none;
          border-left: 1.5px dashed rgba(36,48,42,0.3);
          width: ${STUB_WIDTH};
          flex-shrink: 0;
          position: relative;
        }
        .ticket-stub::before,
        .ticket-stub::after {
          content: "";
          position: absolute;
          left: -9px;
          width: 16px;
          height: 16px;
          border-radius: 50%;
          background: ${PAGE_BG};
        }
        .ticket-stub::before { top: -8px; }
        .ticket-stub::after { bottom: -8px; }
      }

      input::placeholder, textarea::placeholder { color: #B6A98C; }

      @media (max-width: 639px) {
        .app-shell {
          width: 100%;
          max-width: 100%;
          overflow-x: hidden;
        }
        .name-button {
          max-width: 44vw;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .luggage-tag {
          padding: 1.25rem 1.1rem;
          border-radius: 0.55rem 1.05rem 0.55rem 1.05rem;
          transform: rotate(-0.8deg);
        }
        .tag-input {
          width: 100%;
          min-width: 0;
          font-size: 1.45rem;
          line-height: 1.2;
        }
        .tab-row {
          align-items: stretch;
        }
        .tab-button {
          min-width: 0;
          min-height: 3.3rem;
          flex-direction: column;
          line-height: 1.05;
        }
        .tab-button span {
          white-space: nowrap;
        }
        .content-panel {
          border-radius: 0 0 0.85rem 0.85rem;
        }
        .add-button {
          width: 100%;
          min-height: 3rem;
        }
        .export-button {
          width: 100%;
          min-height: 3rem;
        }
        .ticket-card {
          border-radius: 0.85rem;
          overflow: hidden;
        }
        .itinerary-day {
          border-radius: 0.5rem;
        }
        .itinerary-day-head {
          padding: 1rem;
        }
        .itinerary-day-head h2 {
          font-size: 1.5rem;
        }
        .day-edit-button {
          margin-top: 0.15rem;
        }
        .wave-divider {
          white-space: nowrap;
          overflow: hidden;
        }
        .itinerary-summary {
          padding: 0.9rem 1rem;
        }
        .itinerary-table {
          min-width: 720px;
        }
        .itinerary-table th,
        .itinerary-table td {
          padding: 0.85rem;
        }
        .itinerary-time-col {
          width: 8.5rem;
        }
        .ticket-main {
          padding: 1rem;
        }
        .ticket-main h3 {
          font-size: 1rem;
          line-height: 1.35;
        }
        .smart-link {
          max-width: 100%;
        }
        .ticket-stub {
          align-items: stretch;
          border-top: 1.5px dashed rgba(36,48,42,0.3);
          background: rgba(255,247,232,0.42);
        }
        .ticket-stub > div {
          flex: 1;
          min-width: 0;
        }
      }
    `);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
})();

</script>
  </body>
</html>
